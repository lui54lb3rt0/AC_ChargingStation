; PlatformIO Project Configuration File
;
; Three firmwares live in this project, one per environment:
;   uno      - original Arduino Uno charging station (shield V2.2), fixed current
;   station  - XIAO ESP32S3 + Wio-SX1262 charging station, current set over LoRa
;   remote   - XIAO ESP32S3 + Wio-SX1262 that sends the available current over LoRa
;
; Build/upload one of them with:  pio run -e station -t upload
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = station, remote

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<uno/>
lib_deps = jdolinay/avr-debugger@^1.5
debug_tool = avr-stub
debug_port = COM3

; Station and remote use the same Seeed "XIAO ESP32S3 & Wio-SX1262" kit.
; Serial goes over the USB-C connector.
[xiao_lora]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = jgromes/RadioLib@^7.1.2
lib_ignore = PWM
monitor_speed = 115200

[env:station]
extends = xiao_lora
build_src_filter = +<station/>

[env:remote]
extends = xiao_lora
build_src_filter = +<remote/>
